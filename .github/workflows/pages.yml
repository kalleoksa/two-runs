name: Publish demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling a live rollout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # demo.html stays the single source. The site root serves a copy of it, so
      # the deployed URL needs no redirect page and the repo carries no duplicate.
      # checklist.html ships alongside it because the two link to each other by
      # relative path — deploying one without the other leaves a dead link.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp demo.html _site/demo.html
          cp demo.html _site/index.html
          cp checklist.html _site/checklist.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
